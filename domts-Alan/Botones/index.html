<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Simulación de Botones</title>
    <style>
        .fake-button {
            cursor: pointer;
            padding: 10px 20px;
            border: 1px solid black;
            border-radius: 6px;
            background: lightgray;
            display: inline-block;
            margin: 5px;
            transition: transform 0.1s, background 0.2s;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .fake-button:hover {
            background: gray;
        }

        .fake-button:active {
            transform: scale(0.95);
            background: darkgray;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="./dist/main.js"></script>
</body>

</html>
