<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Médicos</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <header>
        <h1>🏥 Panel de Médicos</h1>
        <p>Administración de personal médico</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Registrar nuevo médico</h2>
            <form id="formMedic" class="formulario">
                <input type="text" id="nombre" placeholder="Nombre del médico" required />
                <input type="text" id="especialidad" placeholder="Especialidad del médico" required />
                <input type="email" id="correo" placeholder="Correo del médico" required />
                <button type="submit">Registrar médico</button>
            </form>
            <p id="mensaje" class="mensaje"></p>
        </section>

        <section class="card">
            <h2>Lista de médicos</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especialidad</th>
                        <th>Correo</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaMedics"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Hospital Central © 2026</p>
    </footer>

    <script type="module" src="./dist/index.js"></script>
</body>

</html>
